<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 384" width="900" role="img" aria-label="Architecture"><rect width="900" height="384" rx="16" fill="#E1E1DC"/><text x="32.0" y="58.0" font-family="'Noto Sans CJK SC','Source Han Sans SC','PingFang SC','Microsoft YaHei','Heiti SC',sans-serif" font-size="28" fill="#41423D" text-anchor="start" font-weight="600">Who Judges the Agents?</text><text x="32.0" y="86.0" font-family="'Noto Sans CJK SC','Source Han Sans SC','PingFang SC','Microsoft YaHei','Heiti SC',sans-serif" font-size="13" fill="#73736F" text-anchor="start" font-weight="400">Agent 负责提出想法，实验负责检验想法；成绩由独立规则决定。</text><line x1="250.0" x2="250.0" y1="110" y2="282" stroke="#41423D" stroke-dasharray="3 3"/><rect x="32" y="124" width="196" height="144" rx="12" fill="#F0F0EC" stroke="#C8C7C1" stroke-width="1"/><text x="60.0" y="170.0" font-family="'Noto Sans CJK SC','Source Han Sans SC','PingFang SC','Microsoft YaHei','Heiti SC',sans-serif" font-size="17" fill="#41423D" text-anchor="start" font-weight="600">Propose</text><text x="60.0" y="206.0" font-family="'Noto Sans CJK SC','Source Han Sans SC','PingFang SC','Microsoft YaHei','Heiti SC',sans-serif" font-size="13" fill="#41423D" text-anchor="start" font-weight="400">提出新策略</text><text x="60.0" y="227.0" font-family="'Noto Sans CJK SC','Source Han Sans SC','PingFang SC','Microsoft YaHei','Heiti SC',sans-serif" font-size="13" fill="#41423D" text-anchor="start" font-weight="400">可以探索，不能打分</text><rect x="272" y="124" width="292" height="144" rx="12" fill="#C4C3BD" stroke="#C4C3BD" stroke-width="1"/><text x="300.0" y="170.0" font-family="'Noto Sans CJK SC','Source Han Sans SC','PingFang SC','Microsoft YaHei','Heiti SC',sans-serif" font-size="17" fill="#41423D" text-anchor="start" font-weight="600">Judge</text><text x="300.0" y="206.0" font-family="'Noto Sans CJK SC','Source Han Sans SC','PingFang SC','Microsoft YaHei','Heiti SC',sans-serif" font-size="13" fill="#41423D" text-anchor="start" font-weight="400">用同一套规则评估</text><text x="300.0" y="227.0" font-family="'Noto Sans CJK SC','Source Han Sans SC','PingFang SC','Microsoft YaHei','Heiti SC',sans-serif" font-size="13" fill="#41423D" text-anchor="start" font-weight="400">结果不由 Agent 决定</text><rect x="616" y="124" width="252" height="144" rx="12" fill="#F0F0EC" stroke="#C8C7C1" stroke-width="1"/><text x="644.0" y="170.0" font-family="'Noto Sans CJK SC','Source Han Sans SC','PingFang SC','Microsoft YaHei','Heiti SC',sans-serif" font-size="17" fill="#41423D" text-anchor="start" font-weight="600">Execute</text><text x="644.0" y="206.0" font-family="'Noto Sans CJK SC','Source Han Sans SC','PingFang SC','Microsoft YaHei','Heiti SC',sans-serif" font-size="13" fill="#41423D" text-anchor="start" font-weight="400">让策略接受实际检验</text><text x="644.0" y="227.0" font-family="'Noto Sans CJK SC','Source Han Sans SC','PingFang SC','Microsoft YaHei','Heiti SC',sans-serif" font-size="13" fill="#41423D" text-anchor="start" font-weight="400">每次实验独立进行</text><circle cx="564" cy="183.0" r="3.2" fill="#41423D"/><line x1="564" x2="614" y1="183.0" y2="183.0" stroke="#41423D" stroke-width="1.8"/><path d="M609.5,177.5 L616,183.0 L609.5,188.5" fill="none" stroke="#41423D" stroke-width="1.8"/><circle cx="616" cy="209.0" r="3.2" fill="#41423D"/><line x1="616" x2="566" y1="209.0" y2="209.0" stroke="#41423D" stroke-width="1.8"/><path d="M570.5,203.5 L564,209.0 L570.5,214.5" fill="none" stroke="#41423D" stroke-width="1.8"/><rect x="32" y="304" width="836" height="48" rx="12" fill="#F0F0EC" stroke="#C8C7C1" stroke-width="1"/><circle cx="130.0" cy="268" r="3.2" fill="#41423D"/><line x1="130.0" x2="130.0" y1="268" y2="301" stroke="#41423D" stroke-width="1.8"/><path d="M124.5,296.5 L130.0,303 L135.5,296.5" fill="none" stroke="#41423D" stroke-width="1.8"/><circle cx="418.0" cy="268" r="3.2" fill="#41423D"/><line x1="418.0" x2="418.0" y1="268" y2="301" stroke="#41423D" stroke-width="1.8"/><path d="M412.5,296.5 L418.0,303 L423.5,296.5" fill="none" stroke="#41423D" stroke-width="1.8"/><circle cx="742.0" cy="268" r="3.2" fill="#41423D"/><line x1="742.0" x2="742.0" y1="268" y2="301" stroke="#41423D" stroke-width="1.8"/><path d="M736.5,296.5 L742.0,303 L747.5,296.5" fill="none" stroke="#41423D" stroke-width="1.8"/><text x="60.0" y="333.0" font-family="'Noto Sans CJK SC','Source Han Sans SC','PingFang SC','Microsoft YaHei','Heiti SC',sans-serif" font-size="15" fill="#41423D" text-anchor="start" font-weight="600">Ledger</text><text x="137.0" y="333.0" font-family="'Noto Sans CJK SC','Source Han Sans SC','PingFang SC','Microsoft YaHei','Heiti SC',sans-serif" font-size="13" fill="#41423D" text-anchor="start" font-weight="400">每个策略从提出到评估，都留下可核查的记录。</text></svg>